name: Foundation-model combinatorial optimization CI
on:
  pull_request:
    paths:
      - "projects/foundation-model-combinatorial-optimization/**"
      - ".github/workflows/foundation-model-project.yml"
  push:
    branches: [main]
    paths:
      - "projects/foundation-model-combinatorial-optimization/**"
      - ".github/workflows/foundation-model-project.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/foundation-model-combinatorial-optimization
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/foundation-model-combinatorial-optimization/pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src
      - name: Regression and coverage
        run: pytest
